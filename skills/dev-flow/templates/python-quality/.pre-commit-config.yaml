default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # keep in sync with ruff; update with `pre-commit autoupdate`
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # verified tag; upgrade with `pre-commit autoupdate`
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: prepush
        name: prepush (full gate)
        entry: uv run poe prepush
        language: system
        pass_filenames: false
        stages: [pre-push]
